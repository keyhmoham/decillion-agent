name: ci
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: agent, POSTGRES_PASSWORD: agent, POSTGRES_DB: agent_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agent" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://agent:agent@localhost:5432/agent_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install backend dependencies
        run: |
          python - <<'PY' > /tmp/reqs.txt
          import tomllib
          print("\n".join(tomllib.load(open("backend/pyproject.toml", "rb"))["project"]["dependencies"]))
          PY
          pip install -r /tmp/reqs.txt pytest pytest-asyncio transformers
      - run: python scripts/fetch_tokenizer.py backend/app/llm/assets/tokenizer.json
      - run: python -m pytest tests -q --ignore=tests/test_realmodel.py
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
      - run: docker compose -f docker-compose.yml -f docker-compose.gpu.yml config -q
