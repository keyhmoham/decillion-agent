[project]
name = "decillion-agent-backend"
version = "1.0.0"
description = "Agentic system dedicated to nutboy02/Agents-A1-4B-Kimi-heretic (LangChain + LangGraph)"
requires-python = ">=3.11"
dependencies = [
  "langchain-core>=1.0",
  "langgraph>=1.0",
  "langgraph-checkpoint-postgres>=3.0",
  "langchain-mcp-adapters>=0.2",
  "mcp>=1.24,<2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "psycopg[binary,pool]>=3.2",
  "docker>=7.0",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "jinja2>=3.1",
  "jsonschema>=4.22",
  "tokenizers>=0.20",
  "orjson>=3.10",
  "beautifulsoup4>=4.12",
  "html2text>=2024.2",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "transformers>=4.50"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "realmodel: needs a running Agents-A1-4B server (set A1_TEST_BASE_URL)",
  "postgres: needs PostgreSQL (set TEST_DATABASE_URL)",
  "docker: needs a Docker daemon",
]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"
