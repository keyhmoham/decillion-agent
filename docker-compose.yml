# Decillion Agent - complete stack:   docker compose up --build
#
#   frontend  -> http://localhost:${WEB_PORT:-3000}
#   backend   -> FastAPI + LangGraph agents (talks to the Docker daemon to create one sandbox per chat session)
#   postgres  -> sessions, messages, memory, LangGraph checkpoints
#   ollama    -> serves nutboy02/Agents-A1-4B-Kimi-heretic (pulled automatically on first start)
#   sandbox-image -> builds the per-session agent computer image, then exits

name: decillion

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    image: docker.arvancloud.ir/postgres:16-alpine
    <<: *restart
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent}
      POSTGRES_DB: ${POSTGRES_DB:-agent}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent} -d ${POSTGRES_DB:-agent}"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    <<: *restart
    environment:
      OLLAMA_KEEP_ALIVE: ${LLM_KEEP_ALIVE:-30m}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-2}
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama:/root/.ollama
    # ports: ["11434:11434"]   # uncomment to use the model server from the host too
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  # One-shot: pull the model into the ollama volume (idempotent, a no-op once present).
  model-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      MODEL: ${LLM_MODEL:-nutboy02/Agents-A1-4B-Kimi-heretic:latest}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Ensuring model $${MODEL} is available (about 3.3 GB on first run)..."
        ollama pull "$${MODEL}"
        echo "Model ready."
    restart: "no"

  # One-shot: build the sandbox image the backend launches per chat session.
  sandbox-image:
    build:
      context: .
      dockerfile: sandbox/Dockerfile
      args:
        INSTALL_PLAYWRIGHT: ${SANDBOX_INSTALL_PLAYWRIGHT:-false}
    image: ${SANDBOX_IMAGE:-decillion-sandbox:latest}
    command: ["true"]
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: decillion-backend:latest
    <<: *restart
    depends_on:
      postgres:
        condition: service_healthy
      model-init:
        condition: service_completed_successfully
      sandbox-image:
        condition: service_completed_successfully
    environment:
      ENVIRONMENT: prod
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      APP_API_KEY: ${APP_API_KEY:-}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD:-agent}@postgres:5432/${POSTGRES_DB:-agent}
      LLM_BACKEND: ${LLM_BACKEND:-ollama}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434}
      LLM_MODEL: ${LLM_MODEL:-nutboy02/Agents-A1-4B-Kimi-heretic:latest}
      LLM_NUM_CTX: ${LLM_NUM_CTX:-65536}
      LLM_KEEP_ALIVE: ${LLM_KEEP_ALIVE:-30m}
      THINKING_BUDGET: ${THINKING_BUDGET:-1800}
      CONTEXT_BUDGET: ${CONTEXT_BUDGET:-28000}
      MAX_STEPS: ${MAX_STEPS:-40}
      TEAM_PARALLELISM: ${TEAM_PARALLELISM:-2}
      SANDBOX_BACKEND: docker
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-decillion-sandbox:latest}
      SANDBOX_NETWORK: ${SANDBOX_NETWORK:-bridge}
      SANDBOX_MEMORY: ${SANDBOX_MEMORY:-2g}
      SANDBOX_CPUS: ${SANDBOX_CPUS:-2}
      SANDBOX_IDLE_MINUTES: ${SANDBOX_IDLE_MINUTES:-45}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
    volumes:
      # The backend creates/destroys one sandbox container per chat session through the host daemon.
      # NOTE: access to the Docker socket is root-equivalent on the host. See docs/SECURITY.md for hardening.
      - /var/run/docker.sock:/var/run/docker.sock
    security_opt:
      - no-new-privileges:true
    # ports: ["8000:8000"]   # uncomment to reach the API directly (docs at /docs)

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: decillion-frontend:latest
    <<: *restart
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-3000}:80"

volumes:
  pgdata:
  ollama:
